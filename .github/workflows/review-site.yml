name: Prepare licensed website image
on:
  push:
    branches: [design/dcs-site-20260905]
    paths: [.github/workflows/review-site.yml]
permissions:
  contents: read
jobs:
  image:
    if: github.repository == 'shotomoda0526-hue/inabomi-site' && github.ref == 'refs/heads/design/dcs-site-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve CC0 image and source records
        run: |
          mkdir -p licensed-image
          curl --fail --location --retry 2 --max-time 45 --user-agent 'INABOMI website image review' 'https://upload.wikimedia.org/wikipedia/commons/e/e7/Refinery_factory_in_Kyrgyzstan.jpg' -o licensed-image/plant-source.jpg
          curl --fail --location --max-time 45 --user-agent 'INABOMI website image review' 'https://commons.wikimedia.org/wiki/File:Refinery_factory_in_Kyrgyzstan.jpg' -o licensed-image/source-page.html
          curl --fail --location --max-time 45 'https://creativecommons.org/publicdomain/zero/1.0/legalcode.en' -o licensed-image/cc0-license.html
          sha256sum licensed-image/plant-source.jpg > licensed-image/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inabomi-licensed-image
          path: licensed-image/
          if-no-files-found: error
          retention-days: 7
